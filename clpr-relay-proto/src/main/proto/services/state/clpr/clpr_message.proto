syntax = "proto3";

package com.hedera.hapi.node.state.clpr;

// SPDX-License-Identifier: Apache-2.0
option java_package = "com.hederahashgraph.api.proto.java";
// <<<pbj.java_package = "com.hedera.hapi.node.state.clpr">>> This comment is special code for setting PBJ Compiler java package
option java_multiple_files = true;

import "services/state/clpr/clpr_channel.proto";
import "services/state/clpr/clpr_ledger_configuration.proto";

/**
 * Status of a response to a Data Message.
 */
enum ClprMessageReplyStatus {
    /**
     * Message processed successfully by the destination application.
     */
    SUCCESS = 0;

    /**
     * The destination application reverted during execution.
     */
    APPLICATION_ERROR = 1;

    /**
     * The Connector specified in the message was not found on the destination ledger.
     * The source Connector is slashed.
     */
    CONNECTOR_NOT_FOUND = 2;

    /**
     * The Connector was found but had insufficient funds to pay for execution.
     * The source Connector is slashed.
     */
    CONNECTOR_UNDERFUNDED = 3;

    /**
     * The message was redacted before delivery.
     */
    REDACTED = 4;

    /**
     * The Channel is closing; this message was not processed.
     */
    CHANNEL_CLOSED = 5;
}

/**
 * Data Message: application-level content sent from one ledger to another.
 */
message ClprMessage {
    /**
     * Cross-ledger identifier of the Connector that authorized this message.
     * Both the source and destination ledgers register their local Connector
     * contract under this same identifier, so the destination can look it up
     * directly without any cross-chain mapping.
     */
    bytes connector_id = 1;

    /**
     * Destination application address on the target ledger.
     */
    bytes target_application = 2;

    /**
     * Source-chain caller address, stamped by the CLPR Service at enqueue time.
     */
    bytes sender = 3;

    /**
     * Opaque application payload.
     */
    bytes message_data = 4;
}

/**
 * Response Message: the outcome of a previously received Data Message.
 * Every Data Message produces exactly one Response Message, in order.
 */
message ClprMessageReply {
    /**
     * ID of the originating Data Message this responds to, from the
     * source ledger's outbound queue (the queue that sent the Data Message).
     */
    uint64 message_id = 1;

    /**
     * Structured outcome — determines slash decision on the source ledger.
     */
    ClprMessageReplyStatus status = 2;

    /**
     * Opaque application response (empty on protocol errors).
     */
    bytes message_reply_data = 3;
}

/**
 * Control Message: protocol-level management message.
 * Control messages are enqueued in the same queue as data and response messages,
 * participate in the running hash chain, but are not dispatched to
 * applications, and do not generate responses.
 *
 * Forward compatibility: if a receiver encounters a ClprControlMessage with
 * no oneof variant set (indicating an unknown control message type from a
 * newer protocol version), it MUST reject the entire bundle.
 */
message ClprControlMessage {
    oneof payload {
        /**
         * Configuration propagation to peer ledger.
         */
        ClprConfigUpdate config_update = 1;
    }
}

/**
 * Carries an updated ledger configuration to the peer via the message queue.
 * Lazily enqueued when the local config timestamp is newer than the
 * Channel's last_config_timestamp.
 */
message ClprConfigUpdate {
    /**
     * The updated ledger configuration including its timestamp.
     */
    ClprLedgerConfiguration configuration = 1;
}

/**
 * Marker payload for a slot whose original contents were administratively
 * redacted before delivery. Carries the slot's running_hash_after_processing
 * so the chain can continue without the original payload, plus the
 * originating message_id if the redacted slot was a MessageReply.
 */
message ClprRedactedMessage {
    /**
     * The slot's running_hash_after_processing, preserved across redaction.
     * Receiver adopts this directly when advancing the chain.
     */
    bytes running_hash_after_processing = 1;

    /**
     * Set only if the redacted slot was originally a MessageReply. Carries
     * the message_id of the originating Data Message.
     */
    uint64 originating_message_id = 2;
}

/**
 * All-inclusive payload for a queued message. Distinguishes Data, Response,
 * Control, and Redacted variants. All share the queue, running hash chain,
 * and bundle transport.
 */
message ClprMessagePayload {
    oneof payload {
        /**
         * Data Message — application content.
         */
        ClprMessage message = 1;

        /**
         * Response Message — outcome of a Data Message.
         */
        ClprMessageReply message_reply = 2;

        /**
         * Control Message — protocol management.
         */
        ClprControlMessage control = 3;

        /**
         * Redacted Message — Carries only the running
         * hash and (for redacted replies) the originating message_id.
         */
        ClprRedactedMessage redacted_message = 4;
    }
}

/**
 * Composite key for a queued message.
 */
message ClprMessageKey {
    /**
     * Channel ID identifying the Channel this message belongs to.
     * MUST be exactly 32 bytes.
     */
    bytes channel_id = 1;

    /**
     * Monotonically increasing sequence number within the Channel.
     * Assigned at enqueue time.
     */
    uint64 message_id = 2;
}

/**
 * Stored value for a queued message.
 */
message ClprMessageValue {
    /**
     * The message payload (Data, Response, or Control).
     */
    ClprMessagePayload payload = 1;

    /**
     * Cumulative SHA-256 hash after processing this message.
     * Formula: SHA-256(previous_running_hash || serialized_payload).
     * Initial value: 32 bytes of zeros.
     */
    bytes running_hash_after_processing = 2;
}

/**
 * Queue metadata returned by the verifier after proof verification.
 * Contains the peer's view of its outbound queue state.
 */
message ClprQueueMetadata {
    /**
     * One past the ID of the last message included in the bundle.
     * The last message in the bundle has ID (next_message_id - 1).
     */
    uint64 next_message_id = 1;

    /**
     * Cumulative hash through the last message in the bundle.
     */
    bytes sent_running_hash = 2;

    /**
     * Highest message ID received from peer (our outbound messages
     * that the peer has processed).
     */
    uint64 received_message_id = 3;

    /**
     * Peer's cumulative hash of received messages, for optional
     * cross-validation against our own sent_running_hash.
     */
    bytes received_running_hash = 4;

    /**
     * Sender's current Channel status.
     */
    ClprChannelStatus status = 5;

    /**
     * Opaque identifier for the sender's current Channel.trust_anchor,
     * as returned by the verifier contract alongside new_trust_anchor (or
     * initial_trust_anchor). Empty bytes if no trust anchor has been
     * established. Updated atomically with each trust_anchor write.
     * Endpoints receiving this value look it up in their local trust anchor
     * record to identify which signing authority is installed on the remote
     * ledger and determine whether transition bundles are needed before the
     * next application bundle.
     */
    bytes trust_anchor_id = 6;

    /**
     * The sender's current Channel.endpoint_manifest_version.
     * Allows the receiver to detect whether the remote endpoint manifest has
     * advanced since the last sync. Zero indicates the Channel is PENDING.
     */
    uint64 endpoint_manifest_version = 7;
}

// One message in the bidirectional sync stream, scoped to a single
// Channel (see ClprEndpointService.sync).
message ClprSyncPayload {
    // Channel ID identifying the Channel this message belongs to.
    // MUST be exactly 32 bytes.
    bytes channel_id = 1;

    // A request describing the requestor's own current Channel state, used by
    // the responder to shape a minimal, progress-making bundle. Absent when the
    // requestor has no further request this cycle.
    BundleRequest bundle_request = 2;

    // A response to a previously received BundleRequest. Absent when this
    // message carries no bundle this cycle.
    BundleResponse bundle_response = 3;
}

// Unproven request describing the requestor's own current Channel
// state, used by the responder to build a minimal, progress-making
// bundle. It informs bundle creation only and MUST NOT cause a state
// change: verifyBundle's replay defense, hash-chain check, and
// trust-anchor update (§4.2) remain the sole authorities on state and
// run when the requestor submits the returned bundle. Each field lets
// the responder build against the requestor's current state (§2.1.2).
message BundleRequest {
    // The requestor's claimed current ChannelSyncData.received_message_id.
    // This value +1 determines where to start the message sequence in the response bundle.
    uint64 current_received_message_id = 1;

    // The requestor's current ChannelSyncData.status.
    ClprChannelStatus current_status = 2;

    // The requestor's current Channel.trust_anchor_id.
    bytes current_trust_anchor_id = 3;

    // The requestor's current Channel.endpoint_manifest.version.
    uint64 current_endpoint_manifest_version = 4;
}

// A bundle for the peer's verifier contract.
message BundleResponse {
    // Opaque payload for the receiving ledger's verifier contract. Contains
    // the state proof, the message data it attests to, and whatever else
    // the verifier needs to extract and verify sync data and messages
    // (Merkle paths, ZK proofs, TSS signatures, BLS aggregate signatures, etc.).
    bytes bundle_payload = 1;
}
