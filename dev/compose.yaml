# See dev/README.md for usage, environment variables, and port mappings.
name: clpr-relay-dev

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: anvil
    networks: [clprnet]
    command:
      - --host=0.0.0.0
      - --chain-id=1337
      - --block-time=1
      - --hardfork=cancun
      - --disable-code-size-limit
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    user: "0"
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ${CONTRACTS_DIR:-../../clpr-smart-contracts}:/contracts:ro
      - ./scripts/deploy-contracts.sh:/deploy-contracts.sh:ro
      - ./compose/entrypoint-deployer.sh:/entrypoint.sh:ro
      - deployed:/shared
    environment:
      ANVIL_URL: http://anvil:8545
      # ClprService validates seed endpoints as IP literals (not hostnames), so the
      # relays are pinned to static IPs on the clprnet network below.
      RELAY_A_HOST: 172.30.0.11
      RELAY_B_HOST: 172.30.0.12
      RELAY_GRPC_PORT: "9545"
      CONTRACTS_DIR: /contracts
      OUTPUT_FILE: /shared/deployed.env
      FOUNDRY_CACHE_PATH: /tmp/forge-cache
      FOUNDRY_OUT: /tmp/forge-out
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks: [clprnet]
    restart: "no"

  relay-a:
    build: ..
    image: clpr-evm-endpoint:dev
    depends_on:
      deployer:
        condition: service_completed_successfully
    volumes:
      - deployed:/shared:ro
    environment:
      RELAY_SIGNING_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      RELAY_CONFIG_FILE: /shared/relay-a.yaml
    ports:
      - "9545:9545" # gRPC
      - "9547:9547" # Prometheus metrics
    networks:
      clprnet:
        ipv4_address: 172.30.0.11

  relay-b:
    build: ..
    image: clpr-evm-endpoint:dev
    depends_on:
      deployer:
        condition: service_completed_successfully
    volumes:
      - deployed:/shared:ro
    environment:
      RELAY_SIGNING_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      RELAY_CONFIG_FILE: /shared/relay-b.yaml
    ports:
      - "9555:9545" # gRPC
      - "9557:9547" # Prometheus metrics
    networks:
      clprnet:
        ipv4_address: 172.30.0.12

  msg-sender:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on:
      deployer:
        condition: service_completed_successfully
    volumes:
      - ./scripts/send-messages.sh:/send-messages.sh:ro
      - deployed:/shared:ro
    environment:
      ANVIL_URL: http://anvil:8545
      SETUP_ENV: /shared/deployed.env
      MSG_INTERVAL_MS: "${MSG_INTERVAL_MS:-5000}"
    entrypoint: ["/bin/bash", "/send-messages.sh"]
    networks: [clprnet]
    restart: on-failure

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.53.0
    networks: [clprnet]
    volumes:
      - ./compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.1.0
    networks: [clprnet]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/clpr-relay.json:/var/lib/grafana/dashboards/clpr-relay.json:ro
    ports:
      - "3000:3000"

volumes:
  deployed:

networks:
  clprnet:
    ipam:
      config:
        - subnet: 172.30.0.0/16
